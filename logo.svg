<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Mie Cose">
  <title>Mie Cose</title>
  <desc>Marchio di Mie Cose: un braccio articolato che forma un segno di spunta sopra un libro aperto — organizzare, diritto e studio, robotica.</desc>
  <defs>
    <linearGradient id="bg" x1="8%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B5BFF"/>
      <stop offset="38%" stop-color="#9B4DFF"/>
      <stop offset="72%" stop-color="#2BB8C4"/>
      <stop offset="100%" stop-color="#4C8CFF"/>
    </linearGradient>
    <radialGradient id="sun" cx="86%" cy="12%" r="55%">
      <stop offset="0%" stop-color="#FFC14A" stop-opacity="0.72"/>
      <stop offset="36%" stop-color="#FF7A1A" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FF7A1A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="48%" r="62%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2A1860" stop-opacity="0.18"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F0FF"/>
    </linearGradient>
    <linearGradient id="mark" x1="12%" y1="90%" x2="92%" y2="8%">
      <stop offset="0%" stop-color="#3B32C8"/>
      <stop offset="48%" stop-color="#5B4DFF"/>
      <stop offset="100%" stop-color="#FF7A1A"/>
    </linearGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7F3FF"/>
      <stop offset="100%" stop-color="#DDD6FF"/>
    </linearGradient>
    <linearGradient id="pageR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="100%" stop-color="#FFE2B8"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB020"/>
      <stop offset="100%" stop-color="#FF7A1A"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#2A1860" flood-opacity="0.18"/>
    </filter>
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#3B32C8" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Full-bleed field (icons use a square crop; rounded corners are visual for the brand mark) -->
  <rect id="field" width="1024" height="1024" rx="226" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="226" fill="url(#sun)"/>
  <rect width="1024" height="1024" rx="226" fill="url(#vignette)"/>

  <!-- Inner card -->
  <rect x="164" y="164" width="696" height="696" rx="168" fill="url(#card)" filter="url(#cardShadow)"/>
  <!-- subtle inner highlight -->
  <rect x="184" y="176" width="656" height="220" rx="150" fill="#fff" opacity="0.55"/>

  <!-- Open book (law, study, writing) -->
  <g transform="translate(0,12)">
    <path d="M512 706 C 512 706 430 668 300 676 C 300 676 292 768 300 790 C 368 778 470 798 512 824 Z" fill="url(#pageL)" stroke="#5B4DFF" stroke-opacity="0.28" stroke-width="8" stroke-linejoin="round"/>
    <path d="M512 706 C 512 706 594 668 724 676 C 724 676 732 768 724 790 C 656 778 554 798 512 824 Z" fill="url(#pageR)" stroke="#E08A20" stroke-opacity="0.32" stroke-width="8" stroke-linejoin="round"/>
    <!-- gutter -->
    <path d="M512 708 L 512 824" stroke="#5B4DFF" stroke-opacity="0.35" stroke-width="7" stroke-linecap="round"/>
    <!-- bookmark ribbon -->
    <path d="M534 712 L 558 712 L 558 852 L 546 828 L 534 852 Z" fill="url(#ribbon)"/>
    <!-- type lines on pages -->
    <path d="M360 722 H 470 M 348 746 H 478 M 368 770 H 458" stroke="#5B4DFF" stroke-opacity="0.28" stroke-width="7" stroke-linecap="round"/>
    <path d="M554 722 H 664 M 546 746 H 676 M 566 770 H 652" stroke="#C47A18" stroke-opacity="0.28" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Articulated arm that also reads as a check (organizing + robotics) -->
  <g filter="url(#markShadow)" fill="none" stroke="url(#mark)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round">
    <!-- upper arm (short check stroke) and forearm (long stroke) -->
    <path d="M338 548 L 468 678 L 738 368"/>
  </g>
  <!-- joints -->
  <g filter="url(#markShadow)">
    <circle cx="338" cy="548" r="28" fill="url(#mark)"/>
    <circle cx="338" cy="548" r="12" fill="#FBF8FF"/>
    <circle cx="468" cy="678" r="30" fill="url(#mark)"/>
    <circle cx="468" cy="678" r="12" fill="#FBF8FF"/>
    <!-- wrist / gripper hub -->
    <circle cx="738" cy="368" r="26" fill="url(#mark)"/>
  </g>
  <!-- parallel-jaw gripper, slightly open, holding a spark -->
  <g stroke="url(#mark)" stroke-width="16" stroke-linecap="round" fill="none" transform="translate(738,368) rotate(-42)">
    <path d="M 8 -22 L 42 -22 L 50 -8"/>
    <path d="M 8 22 L 42 22 L 50 8"/>
    <path d="M 8 -16 L 8 16" stroke-width="14"/>
  </g>
  <!-- spark / idea held by the gripper -->
  <g transform="translate(806,300)" fill="#FF7A1A">
    <path d="M0 -28 L 7 -7 L 28 0 L 7 7 L 0 28 L -7 7 L -28 0 L -7 -7 Z"/>
    <circle cx="0" cy="0" r="6" fill="#FFC14A"/>
  </g>
</svg>
