<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mie Cose">
    <meta name="application-name" content="Mie Cose">
    <meta name="theme-color" content="#F3F0FA" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#07070B" media="(prefers-color-scheme: dark)">
    <meta name="description" content="La tua app personale: cose da fare, studio, soldi e il braccio robotico.">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-180.png" sizes="180x180">
    <link rel="icon" type="image/png" href="icons/favicon.png">
    <title>Mie Cose</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body data-theme="home">
    <div class="ambiance" aria-hidden="true">
      <span class="orb orb-a"></span>
      <span class="orb orb-b"></span>
      <span class="orb orb-c"></span>
    </div>
    <div id="app">
      <header class="topbar" id="topbar">
        <div class="topbar-inner">
          <button type="button" class="icon-btn hidden" id="back-btn" aria-label="Indietro"></button>
          <img class="brand-logo" id="brand-logo" src="logo.svg" width="40" height="40" alt="Mie Cose">
          <div class="topbar-titles">
            <p class="eyebrow" id="eyebrow"></p>
            <h1 id="title">Mie Cose</h1>
          </div>
          <button type="button" class="icon-btn" id="settings-btn" aria-label="Impostazioni" title="Impostazioni">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>
        </div>
      </header>

      <main id="content" class="content"></main>

      <button type="button" class="fab hidden" id="fab" aria-label="Aggiungi">
        <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M12 5v14M5 12h14"></path>
        </svg>
      </button>

      <nav class="tabbar" id="tabbar" aria-label="Sezioni">
        <button type="button" class="tab active" data-tab="home">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 11.5 12 4l8 7.5"></path>
            <path d="M6.5 10.5V20h11V10.5"></path>
          </svg>
          <span>Inizio</span>
        </button>
        <button type="button" class="tab" data-tab="tasks">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 6h11M9 12h11M9 18h11"></path>
            <path d="M4 6.2 5.2 7.5 7.2 5.2"></path>
            <circle cx="5.5" cy="12" r="1.4"></circle>
            <circle cx="5.5" cy="18" r="1.4"></circle>
          </svg>
          <span>Da fare</span>
        </button>
        <button type="button" class="tab" data-tab="study">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 6.5c2.2-1.2 4.4-1.5 8-0.2 3.6-1.3 5.8-1 8 .2v11c-2.2-1.2-4.4-1.5-8-.2-3.6 1.3-5.8 1-8-.2v-11z"></path>
            <path d="M12 6.5v10.8"></path>
          </svg>
          <span>Studio</span>
        </button>
        <button type="button" class="tab" data-tab="money">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="6" width="18" height="13" rx="2.2"></rect>
            <path d="M3 10h18"></path>
            <path d="M8 15.2h2.2M14.2 14.3c.4-.5 1-.8 1.7-.8 1.2 0 2 .7 2 1.7 0 2.2-3.7 1.2-3.7 3.2h3.8"></path>
          </svg>
          <span>Soldi</span>
        </button>
        <button type="button" class="tab" data-tab="arm">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="6" cy="19" r="2.1"></circle>
            <path d="M6 16.8V11.2"></path>
            <circle cx="6" cy="10.2" r="1.3"></circle>
            <path d="M7.2 9.4 12.5 6.4 16.2 11.2"></path>
            <circle cx="16.2" cy="11.2" r="1.3"></circle>
            <path d="M17.3 10.5 20.6 8.4"></path>
            <path d="M19.2 6.8 21.8 10"></path>
          </svg>
          <span>Braccio</span>
        </button>
      </nav>
    </div>

    <div id="sheet-root" class="sheet-root" hidden></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>
    <input type="file" id="import-file" accept="application/json,.json" hidden>

    <script src="push-config.js"></script>
    <script src="frasi.js"></script>
    <script type="module" src="arm3d.js"></script>
    <script src="app.js" defer></script>
  </body>
</html>
